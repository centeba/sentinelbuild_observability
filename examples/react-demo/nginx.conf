server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; resolving per request lets nginx start even when
    # obs-gateway is not up (or not on this network) yet.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Same-origin telemetry ingest -> obs-gateway.
    location /api/telemetry/ {
        client_max_body_size 2m;
        set $obs_gateway http://obs-gateway:8080;
        proxy_pass $obs_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
