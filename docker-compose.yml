# Self-contained observability platform — run the whole thing with one command:
#
#   cp .env.example .env && docker compose up -d
#
# obs-gateway (ingest + health API) + OTEL Collector (OTLP in) -> Loki (logs) +
# Tempo (traces) + Prometheus (metrics), with Grafana as the single pane. No
# dependency on any host platform; point your apps' OTEL_EXPORTER_OTLP_ENDPOINT
# at the collector and your frontends at the gateway. UIs bind to loopback.
#
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Tests:      docker-compose.test.yml (unit tests), docker-compose.smoke.yml (end-to-end)
# Profile "demo": React demo app on http://127.0.0.1:5173 (docker compose --profile demo up -d)
#
# Config files are bind-mounted from this repo into each container, e.g.
# ./loki/config.yml -> /etc/loki/config.yml (a path inside the container).
name: observability

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # One-shot: creates the local log directories (LOCAL_LOG_DIR, default ./logs)
  # writable by the non-root gateway and collector (uid 10001), then exits.
  log-dir-init:
    image: busybox:1.36
    restart: "no"
    command:
      - sh
      - -c
      - mkdir -p /logs/obs-gateway /logs/otel-collector && chown -R 10001:10001 /logs/obs-gateway /logs/otel-collector
    volumes:
      - ${LOCAL_LOG_DIR:-./logs}:/logs

  obs-gateway:
    build:
      context: ./gateway
      target: runtime
    image: obs-gateway:local
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: .env
        required: false
    environment:
      OBS_OTEL_ENDPOINT: http://otel-collector:4318
      OBS_ENVIRONMENT: ${ENVIRONMENT:-development}
      # Stack-health records and (while the stack is unhealthy) frontend events.
      OBS_FALLBACK_LOG_DIR: /var/log/obs
      PORT: "8080"
    volumes:
      - ${LOCAL_LOG_DIR:-./logs}/obs-gateway:/var/log/obs
    ports:
      - "127.0.0.1:8080:8080"
    # HEALTHCHECK (GET /health) is defined in gateway/Dockerfile. The gateway
    # also monitors the rest of the stack: GET /status/stack.
    depends_on:
      log-dir-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    restart: unless-stopped
    logging: *logging
    command:
      - "--config=/etc/otelcol/config.yml"
      # Local-file fallback for logs: failover | mirror | queue (see otel-collector/fallback-*.yml).
      - "--config=/etc/otelcol/fallback-${COLLECTOR_FALLBACK_MODE:-failover}.yml"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COLLECTOR_FALLBACK_MAX_MB: ${COLLECTOR_FALLBACK_MAX_MB:-50}
      COLLECTOR_FALLBACK_MAX_BACKUPS: ${COLLECTOR_FALLBACK_MAX_BACKUPS:-5}
    volumes:
      - ./otel-collector:/etc/otelcol:ro
      - ${LOCAL_LOG_DIR:-./logs}/otel-collector:/var/log/otelcol
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    # Distroless image (no shell/wget) — no container healthcheck possible;
    # its health endpoint (:13133) is probed by obs-gateway's stack monitor.
    depends_on:
      log-dir-init:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    logging: *logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy

  # ── demo profile: React demo app, same-origin proxy to the gateway ─────────
  react-demo:
    profiles: [demo]
    build:
      context: .
      dockerfile: examples/react-demo/Dockerfile
    image: obs-react-demo:local
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      obs-gateway:
        condition: service_healthy

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
