# Self-contained observability platform — run the whole thing with one command:
#
#   cd observability && cp .env.example .env && docker compose up -d
#
# obs-gateway (ingest + health API) + OTEL Collector (OTLP in) -> Loki (logs) +
# Tempo (traces) + Prometheus (metrics), with Grafana as the single pane. No
# dependency on any host platform; point your apps' OTEL_EXPORTER_OTLP_ENDPOINT
# at the collector and your frontends at the gateway. UIs bind to loopback.
name: observability

services:
  obs-gateway:
    build: ./gateway
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      OBS_OTEL_ENDPOINT: http://otel-collector:4318
      OBS_ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./otel-collector/config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - loki
      - tempo
      - prometheus

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  # ── demo profile: React demo app, same-origin proxy to the gateway ─────────
  #   docker compose --profile demo up -d   ->  http://127.0.0.1:5173
  react-demo:
    profiles: [demo]
    build:
      context: .
      dockerfile: examples/react-demo/Dockerfile
    image: obs-react-demo:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      obs-gateway:
        condition: service_healthy

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
