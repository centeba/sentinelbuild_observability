# obs-edge — the single secured entry point for people and tools.
#
# Every request is authorized by obs-gateway's forward-auth endpoint
# (GET /authz/verify) before it is proxied:
#   /             Grafana UI        (action ui:access; Grafana auth-proxy user + role)
#   /loki/        Loki HTTP API     (action logs:read;   X-Scope-OrgID = caller's tenant)
#   /tempo/       Tempo HTTP API    (action traces:read; X-Scope-OrgID = caller's tenant)
#   /prometheus/  Prometheus API    (action metrics:read)
#
# Callers authenticate with "Authorization: Bearer <jwt>" or the obs_token
# cookie. Terminate TLS in front of this proxy (or add ssl_* directives here).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Internal authorization sub-request.
    location = /_authz {
        internal;
        set $obs_gateway http://obs-gateway:8080;
        proxy_pass $obs_gateway/authz/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # Map forward-auth outcomes to user-facing responses.
    error_page 401 = @unauthenticated;
    error_page 403 = @forbidden;
    location @unauthenticated { default_type text/plain; return 401 "authentication required\n"; }
    location @forbidden { default_type text/plain; return 403 "forbidden\n"; }

    location /loki/ {
        auth_request /_authz;
        auth_request_set $obs_tenant $upstream_http_x_scope_orgid;
        set $loki http://loki:3100;
        rewrite ^/loki/(.*)$ /$1 break;
        proxy_pass $loki;
        proxy_set_header X-Scope-OrgID $obs_tenant;
    }

    location /tempo/ {
        auth_request /_authz;
        auth_request_set $obs_tenant $upstream_http_x_scope_orgid;
        set $tempo http://tempo:3200;
        rewrite ^/tempo/(.*)$ /$1 break;
        proxy_pass $tempo;
        proxy_set_header X-Scope-OrgID $obs_tenant;
    }

    location /prometheus/ {
        auth_request /_authz;
        set $prometheus http://prometheus:9090;
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass $prometheus;
    }

    location / {
        auth_request /_authz;
        auth_request_set $obs_user $upstream_http_x_webauth_user;
        auth_request_set $obs_role $upstream_http_x_webauth_role;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Grafana trusts these only from this proxy (GF_AUTH_PROXY_WHITELIST).
        proxy_set_header X-WEBAUTH-USER $obs_user;
        proxy_set_header X-WEBAUTH-ROLE $obs_role;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
