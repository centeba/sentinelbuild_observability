# Fallback mode "failover" (default): logs go to Loki; while Loki is
# unreachable they are written to a rotating local JSON file instead, and
# delivery switches back to Loki once it recovers.
#
# The Loki exporter's queue and retries are disabled on this path so a failed
# export surfaces to the failover connector immediately rather than being
# buffered in memory.
connectors:
  failover/logs:
    priority_levels:
      - [logs/loki]
      - [logs/local_file]
    retry_interval: 30s

exporters:
  otlp_http/loki:
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false
  file/logs:
    path: /var/log/otelcol/logs.jsonl
    format: json
    rotation:
      max_megabytes: ${env:COLLECTOR_FALLBACK_MAX_MB}
      max_backups: ${env:COLLECTOR_FALLBACK_MAX_BACKUPS}

service:
  pipelines:
    logs:
      exporters: [failover/logs]
    logs/loki:
      receivers: [failover/logs]
      exporters: [otlp_http/loki]
    logs/local_file:
      receivers: [failover/logs]
      exporters: [file/logs]
