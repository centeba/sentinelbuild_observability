[project]
name = "obs-gateway"
version = "0.2.0"
description = "Self-contained observability gateway: frontend/app telemetry ingest + fleet health aggregation, forwarding to an OTLP collector."
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.10.0",
    "opentelemetry-sdk>=1.44.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obs_gateway"]

[tool.mypy]
strict = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends/Header defaults

[tool.pytest.ini_options]
addopts = "--cov=obs_gateway --cov-report=term-missing --cov-fail-under=60"
pythonpath = ["src"]
