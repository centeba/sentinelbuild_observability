name: obs_telemetry
description: >-
  Self-contained Flutter/Dart client for the observability platform: captures
  crashes, errors, logs and page/perf events and ships them (batched) to the
  obs-gateway ingest endpoint. Transport is dependency-light (package:http).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.2.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0"
