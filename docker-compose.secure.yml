# RBAC-secured access overlay. Use with the base file (and optionally prod):
#
#   docker compose -f docker-compose.yml -f docker-compose.secure.yml up -d
#
# - obs-edge (http://127.0.0.1:8443) becomes the only way to reach the Grafana
#   UI and the Loki / Tempo / Prometheus APIs; each request is authorized by
#   obs-gateway (GET /authz/verify) using OBS_AUTHZ_MODE (static | external).
# - Grafana runs in auth-proxy mode: users and org roles come from the edge
#   headers; its own login form and direct host port are disabled.
# - Requires a JWT verification setting (OBS_JWT_SECRET or OBS_JWT_JWKS_URL).
name: observability

services:
  obs-edge:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8443:8080"
    depends_on:
      obs-gateway:
        condition: service_healthy
      grafana:
        condition: service_healthy

  obs-gateway:
    environment:
      OBS_AUTHZ_MODE: ${OBS_AUTHZ_MODE:-static}

  grafana:
    environment:
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: Role:X-WEBAUTH-ROLE
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      # Only trust identity headers arriving over the compose network (obs-edge).
      GF_AUTH_PROXY_WHITELIST: ${GRAFANA_AUTH_PROXY_WHITELIST:-172.16.0.0/12, 10.0.0.0/8, 192.168.0.0/16}
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports: !reset []
