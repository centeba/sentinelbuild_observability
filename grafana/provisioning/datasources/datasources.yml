# Grafana datasource provisioning — one pane with trace<->log correlation.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: obs-prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    uid: obs-loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: obs-tempo
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    access: proxy
    uid: obs-tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: obs-loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        tags:
          - key: service.name
            value: service_name
      serviceMap:
        datasourceUid: obs-prometheus
